services:
  - type: web
    name: twelve-factor-config
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_PORT
        value: "8935"
      - key: APP_LOG_LEVEL
        value: "info"
